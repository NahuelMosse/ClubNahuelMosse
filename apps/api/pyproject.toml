[project]
name = "clubnahuelmosse-api"
version = "0.1.0"
description = "API REST de ClubNahuelMosse"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "firebase-admin>=6.5",
    "email-validator>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx2>=2.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Los escenarios quedan congelados al commitearse en rojo: el estilo no justifica recongelarlos.
"tests/escenarios/*" = ["E501", "SIM117"]

[tool.mypy]
strict = true
files = ["app", "tests"]
explicit_package_bases = true
mypy_path = "$MYPY_CONFIG_FILE_DIR:$MYPY_CONFIG_FILE_DIR/tests/escenarios"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# firebase-admin no publica tipos
module = ["firebase_admin", "firebase_admin.*"]
ignore_missing_imports = true
