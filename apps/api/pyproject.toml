[project]
name = "clubnahuelmosse-api"
version = "0.1.0"
description = "API REST de ClubNahuelMosse"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "firebase-admin>=6.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx2>=2.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
filterwarnings = ["error", "ignore:MulticastMessage.tokens:DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C90", "PLR", "RET", "N", "ERA", "FBT"]
# N818: the domain exceptions are named after the case (SlotTaken, NotFound), without the `Error` suffix.
ignore = ["N818"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 4

[tool.ruff.lint.per-file-ignores]
# With `--select` the global `ignore` does not apply: the domain exceptions stay without the `Error` suffix.
"app/**/*.py" = ["N818"]
# Each `Depends` of a FastAPI route counts as a parameter and is the framework's way to inject.
"app/modules/*/rutas*.py" = ["PLR0913", "PLR0917"]
"app/modules/*/*routes.py" = ["PLR0913", "PLR0917"]
# The readable-code rules are for the API; the tests follow pytest's style (boolean parameters
# of `parametrize`, expected values written in the test).
"tests/**/*.py" = ["C90", "PLR", "RET", "N", "ERA", "FBT"]
# Frozen test: its literals are the thresholds it checks.
"tests/unit/test_code_readable.py" = ["E501", "PLR2004", "SIM102", "C901"]
"tests/integration/test_api_readable.py" = ["E501"]
# The scenarios are frozen when they are committed red: style does not justify freezing them again.
"tests/scenarios/*" = ["E501", "SIM117", "I001", "B008"]
# These scenarios import the fixtures of test_data.py so that pytest sees them.
"tests/scenarios/test_data_*.py" = ["E501", "SIM117", "I001", "B008", "F811"]
# Frozen tests of SIM-01 (docstrings with the tag and the name of the spec).
"tests/unit/test_no_overengineering.py" = ["E501"]
"tests/unit/test_body_bounded.py" = ["E501"]
"tests/integration/test_no_overengineering_api.py" = ["E501", "I001"]
"tests/integration/test_notice_in_delivery_lost.py" = ["E501"]
"tests/integration/test_uuid_and_audit.py" = ["E501"]
"tests/integration/test_reminder_five_base.py" = ["E501"]
"tests/unit/test_reminder_five.py" = ["SIM300"]
# Frozen tests with long literals.
"tests/unit/test_layers_features.py" = ["E501"]
# Imports the admin and user token fixtures so that pytest sees them.
"tests/scenarios/test_basketball_3x3.py" = ["E501", "SIM117", "I001", "B008", "F811"]
"tests/unit/test_without_suppressions.py" = ["E501"]
"tests/unit/test_emails_with_design.py" = ["E501"]

[tool.mypy]
strict = true
files = ["app", "tests"]
explicit_package_bases = true
mypy_path = "$MYPY_CONFIG_FILE_DIR:$MYPY_CONFIG_FILE_DIR/tests/scenarios"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# firebase-admin does not publish types
module = ["firebase_admin", "firebase_admin.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# PyYAML does not publish types
module = ["yaml"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# frozen tests of REV-01: they are annotated with error ignores, not edited
module = [
  "*.test_seguridad_api",
  "*.test_seguridad_entradas_extra",
  "*.test_identidad_ingreso",
  "*.test_entradas",
  "test_seguridad_api",
  "test_seguridad_entradas_extra",
  "test_identidad_ingreso",
  "test_entradas",
]
disable_error_code = ["var-annotated", "attr-defined", "dict-item"]

[[tool.mypy.overrides]]
# frozen test of REV-01: it is not edited
module = [
  "*.test_repositorios_propios",
  "test_repositorios_propios",
]
disable_error_code = ["var-annotated"]
