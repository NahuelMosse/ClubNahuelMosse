[project]
name = "clubnahuelmosse-api"
version = "0.1.0"
description = "API REST de ClubNahuelMosse"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "firebase-admin>=6.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx2>=2.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C90", "PLR", "RET", "N", "ERA", "FBT"]
# N818: las excepciones del dominio conservan sus nombres en castellano (HorarioOcupado,
# NoEncontrada), sin el sufijo `Error`.
ignore = ["N818"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 4

[tool.ruff.lint.per-file-ignores]
# Con `--select` el `ignore` global no rige: las excepciones del dominio siguen sin sufijo `Error`.
"app/**/*.py" = ["N818"]
# Cada `Depends` de una ruta de FastAPI cuenta como parámetro y es la forma de inyectar del framework.
"app/modules/*/rutas*.py" = ["PLR0913", "PLR0917"]
# Las reglas de código legible son para la API; los tests siguen el estilo de pytest (parámetros
# booleanos de `parametrize`, valores esperados escritos en el test).
"tests/**/*.py" = ["C90", "PLR", "RET", "N", "ERA", "FBT"]
# Test congelado: sus literales son los umbrales que comprueba.
"tests/unit/test_codigo_legible.py" = ["E501", "PLR2004", "SIM102", "C901"]
"tests/integracion/test_api_legible.py" = ["E501"]
# Los escenarios quedan congelados al commitearse en rojo: el estilo no justifica recongelarlos.
"tests/escenarios/*" = ["E501", "SIM117", "I001", "B008"]
# Estos escenarios importan los fixtures de test_datos.py para que pytest los vea.
"tests/escenarios/test_datos_*.py" = ["E501", "SIM117", "I001", "B008", "F811"]
# Tests congelados de SIM-01 (docstrings con la tag y el nombre de la spec).
"tests/unit/test_sin_sobreingenieria.py" = ["E501"]
"tests/unit/test_cuerpo_acotado.py" = ["E501"]
"tests/integracion/test_sin_sobreingenieria_api.py" = ["E501", "I001"]
"tests/integracion/test_aviso_en_envio_perdido.py" = ["E501"]
"tests/integracion/test_uuid_y_auditoria.py" = ["E501"]
"tests/integracion/test_recordatorio_cinco_base.py" = ["E501"]
"tests/unit/test_recordatorio_cinco.py" = ["SIM300"]
# Tests congelados con literales largos.
"tests/unit/test_capas.py" = ["E501"]
"tests/unit/test_sin_supresiones.py" = ["E501"]
"tests/unit/test_correos_con_diseno.py" = ["E501"]

[tool.mypy]
strict = true
files = ["app", "tests"]
explicit_package_bases = true
mypy_path = "$MYPY_CONFIG_FILE_DIR:$MYPY_CONFIG_FILE_DIR/tests/escenarios"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# firebase-admin no publica tipos
module = ["firebase_admin", "firebase_admin.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# PyYAML no publica tipos
module = ["yaml"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# tests congelados de REV-01: se anotan con ignores de error, no se editan
module = [
  "*.test_seguridad_api",
  "*.test_seguridad_entradas_extra",
  "*.test_identidad_ingreso",
  "*.test_entradas",
  "test_seguridad_api",
  "test_seguridad_entradas_extra",
  "test_identidad_ingreso",
  "test_entradas",
]
disable_error_code = ["var-annotated", "attr-defined", "dict-item"]

[[tool.mypy.overrides]]
# test congelado de REV-01: no se edita
module = [
  "*.test_repositorios_propios",
  "test_repositorios_propios",
]
disable_error_code = ["var-annotated"]
