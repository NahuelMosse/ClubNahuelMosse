name: clubnahuelmosse
description: "ClubNahuelMosse: reservas de espacios deportivos."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  clock: ^1.1.2
  http: ^1.2.2
  go_router: ^14.3.0
  intl: any
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  shared_preferences: ^2.5.5
  firebase_messaging: ^16.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/imagenes/
    - assets/imagenes/sedes/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fuentes/Inter-Regular.ttf
          weight: 400
        - asset: assets/fuentes/Inter-Medium.ttf
          weight: 500
        - asset: assets/fuentes/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fuentes/Inter-Bold.ttf
          weight: 700
    - family: Archivo
      fonts:
        - asset: assets/fuentes/Archivo-ExtraBold.ttf
          weight: 800
    - family: Archivo Black
      fonts:
        - asset: assets/fuentes/ArchivoBlack-Regular.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fuentes/JetBrainsMono-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icono/icono.png"
  adaptive_icon_background: "#0A0A0B"
  adaptive_icon_foreground: "assets/icono/icono_primer_plano.png"
