# La máquina de desarrollo es compartida: con 8 GB de heap Gradle se queda sin memoria nativa.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx1G
android.useAndroidX=true
android.enableJetifier=true
# El caché de Pub está en C: y el proyecto en D:: el incremental de Kotlin no cruza unidades.
kotlin.incremental=false
