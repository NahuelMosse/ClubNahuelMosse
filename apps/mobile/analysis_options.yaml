include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Ayudantes del kit, copiados tal cual por el perfil flutter.
    - test/kit/**
    # Tests congelados de cards anteriores que ya no compilan: cada uno tiene su reemplazo declarado en
    # specs/ENG-19-app-bilingue/card.md (`replaces:`), que es el que se analiza y se corre.
    - test/account_in_english_test.dart
    - test/bookings_in_english_test.dart
    - test/buscar_cancha_test.dart
    - test/capas_test.dart
    - test/notificaciones_test.dart
    - test/pantalla_registro_test.dart
    - test/recuperacion_test.dart
    - test/registration_limits_rules_test.dart
    - test/reglas_registro_test.dart
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_required_param: error
    missing_return: error

linter:
  rules:
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - avoid_dynamic_calls
    - unawaited_futures
    - directives_ordering
    - avoid_positional_boolean_parameters
