include: package:flutter_lints/flutter.yaml

analyzer:
  # Test congelado en rojo con un import que quedó sin uso: no se puede editar y `flutter test` lo sigue corriendo.
  exclude:
    - test/anular_desde_el_detalle_test.dart
    # Ayudantes del kit, copiados tal cual por el perfil flutter.
    - test/kit/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_required_param: error
    missing_return: error

linter:
  rules:
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - avoid_dynamic_calls
    - unawaited_futures
