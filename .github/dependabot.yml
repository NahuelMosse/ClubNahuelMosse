version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    # Patch and minor updates of an ecosystem arrive in one pull request; each major gets its own.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directories: [/, /docs-site]
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /apps/api
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: pub
    directory: /apps/mobile
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
