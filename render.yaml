# Render blueprint: the API and its database. Render asks for the values with `sync: false` when
# it creates the blueprint; they do not live in the repo.
services:
  - type: web
    name: clubnahuelmosse-api
    runtime: python
    plan: free
    rootDir: apps/api
    # Migrations run in the build because preDeployCommand does not exist in the free plan.
    # With a paid plan, move them to `preDeployCommand: uv run --no-sync alembic upgrade head`.
    buildCommand: uv sync --frozen --no-dev && uv run --no-sync alembic upgrade head
    startCommand: uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: DATABASE_URL
        fromDatabase:
          name: clubnahuelmosse-db
          property: connectionString
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_API_KEY
        sync: false
      # The service account JSON (a blueprint does not declare Secret Files).
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      # https://<service name>.onrender.com, the one Render shows when it creates the service.
      - key: PUBLIC_URL
        sync: false
      - key: EMAIL_MODE
        value: brevo
      # Free Render blocks outgoing SMTP: the email goes out through Brevo's HTTP API.
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_SENDER
        sync: false

databases:
  - name: clubnahuelmosse-db
    plan: free
    databaseName: club
    user: club
